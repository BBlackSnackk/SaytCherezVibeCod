<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Сторінку не знайдено — Вівальді</title>
  <meta name="robots" content="noindex">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;700&family=Prata&display=swap" rel="stylesheet">
  <style>
    :root { --bg: #fbf5ee; --ink: #2b2420; --muted: #7a6f66; --accent: #8a3b45; --accent-strong: #6b2a33; }
    * { box-sizing: border-box; margin: 0; }
    body { min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; background: var(--bg); color: var(--ink);
      font-family: 'Manrope', system-ui, sans-serif; text-align: center; }
    main { max-width: 460px; display: grid; gap: 14px; justify-items: center; }
    .code { font-family: 'Prata', Georgia, serif; font-size: clamp(72px, 20vw, 120px); line-height: 1; color: var(--accent); }
    h1 { font-family: 'Prata', Georgia, serif; font-weight: 400; font-size: 28px; }
    p { color: var(--muted); line-height: 1.55; }
    a { margin-top: 8px; display: inline-block; padding: 12px 24px; border-radius: 999px; background: var(--accent); color: #fff;
      font-weight: 700; text-decoration: none; }
    a:hover { background: var(--accent-strong); }
    a:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <div class="code" aria-hidden="true">404</div>
    <h1>Цієї сторінки немає</h1>
    <p>Схоже, посилання застаріло або в адресі помилка. Повертайтеся до каталогу — там на вас чекають усі чотири сезони.</p>
    <a id="home" href="./">На головну</a>
  </main>
  <script>
    // На GitHub Pages сайт проєкту живе в підпапці /назва-репозиторію/
    var seg = location.pathname.split('/')[1];
    if (location.hostname.endsWith('github.io') && seg) document.getElementById('home').href = '/' + seg + '/';
    else document.getElementById('home').href = '/';
  </script>
</body>
</html>
